<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
  <!-- Phone body -->
  <rect x="15" y="4" width="20" height="42" rx="4" fill="#0d1520" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="18" y="10" width="14" height="24" rx="1" fill="#050c14"/>
  <!-- Notch pill -->
  <rect x="21" y="7" width="8" height="2" rx="1" fill="#00d4ff" opacity="0.35"/>
  <!-- Home indicator bar -->
  <rect x="21" y="40" width="8" height="2" rx="1" fill="#00d4ff" opacity="0.4"/>
  <!-- Power button -->
  <rect x="35" y="14" width="1.2" height="8" rx="0.6" fill="#00d4ff" opacity="0.55"/>
  <!-- Volume buttons -->
  <rect x="13.8" y="14" width="1.2" height="5" rx="0.6" fill="#00d4ff" opacity="0.4"/>
  <rect x="13.8" y="21" width="1.2" height="5" rx="0.6" fill="#00d4ff" opacity="0.4"/>
  <!-- Screen content -->
  <line x1="21" y1="18" x2="29" y2="18" stroke="#00ff41" stroke-width="1.2"/>
  <line x1="21" y1="22" x2="32" y2="22" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <line x1="21" y1="26" x2="28" y2="26" stroke="#00d4ff" stroke-width="1" opacity="0.45"/>
  <!-- Cursor -->
  <rect x="21" y="29" width="3" height="2" fill="#00ff41"/>
</svg>
