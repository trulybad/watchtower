<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
  <!-- Screen lid -->
  <rect x="8" y="7" width="34" height="22" rx="2" fill="#0d1520" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Screen glass -->
  <rect x="11" y="10" width="28" height="16" rx="1" fill="#050c14"/>
  <!-- Screen content -->
  <line x1="14" y1="16" x2="25" y2="16" stroke="#00ff41" stroke-width="1.2"/>
  <line x1="14" y1="20" x2="30" y2="20" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <!-- Cursor -->
  <rect x="14" y="23" width="3" height="2" fill="#00ff41"/>
  <!-- Camera dot -->
  <circle cx="25" cy="8.5" r="1" fill="#00d4ff" opacity="0.4"/>
  <!-- Hinge -->
  <line x1="8" y1="29" x2="42" y2="29" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <!-- Base/keyboard -->
  <path d="M4 29 L8 29 L8 31 L42 31 L42 29 L46 29 L46 33 Q46 35 44 35 L6 35 Q4 35 4 33 Z" fill="#0d1520" stroke="#00d4ff" stroke-width="1.3"/>
  <!-- Keyboard texture -->
  <rect x="8" y="31.5" width="13" height="1.5" rx="0.5" fill="#00d4ff" opacity="0.15"/>
  <rect x="23" y="31.5" width="13" height="1.5" rx="0.5" fill="#00d4ff" opacity="0.15"/>
  <!-- Touchpad -->
  <rect x="19" y="34" width="12" height="0.8" fill="none" stroke="#00d4ff" stroke-width="0.7" opacity="0.35"/>
</svg>
