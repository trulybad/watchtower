<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
  <!-- Tablet body -->
  <rect x="12" y="4" width="26" height="42" rx="3.5" fill="#0d1520" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="15" y="9" width="20" height="28" rx="1" fill="#050c14"/>
  <!-- Speaker grille top -->
  <rect x="22" y="6" width="6" height="1.5" rx="0.8" fill="#00d4ff" opacity="0.35"/>
  <!-- Home button ring -->
  <circle cx="25" cy="43" r="2" fill="none" stroke="#00d4ff" stroke-width="1"/>
  <!-- Screen content -->
  <line x1="18" y1="17" x2="27" y2="17" stroke="#00ff41" stroke-width="1.2"/>
  <line x1="18" y1="21" x2="32" y2="21" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <line x1="18" y1="25" x2="29" y2="25" stroke="#00d4ff" stroke-width="1" opacity="0.45"/>
  <!-- Cursor -->
  <rect x="18" y="28" width="3" height="2" fill="#00ff41"/>
  <!-- Volume buttons -->
  <rect x="12" y="15" width="1" height="5" rx="0.5" fill="#00d4ff" opacity="0.5"/>
  <rect x="12" y="22" width="1" height="5" rx="0.5" fill="#00d4ff" opacity="0.5"/>
</svg>
