<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
  <!-- Monitor frame -->
  <rect x="4" y="5" width="42" height="29" rx="3" fill="#0d1520" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Screen glass -->
  <rect x="7" y="8" width="36" height="23" rx="1" fill="#050c14"/>
  <!-- Screen top-left accent bar -->
  <rect x="7" y="8" width="8" height="2" rx="0.5" fill="#00d4ff" opacity="0.25"/>
  <!-- Terminal lines -->
  <line x1="11" y1="15" x2="23" y2="15" stroke="#00ff41" stroke-width="1.2"/>
  <line x1="11" y1="19" x2="29" y2="19" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <line x1="11" y1="23" x2="21" y2="23" stroke="#00d4ff" stroke-width="1" opacity="0.45"/>
  <!-- Cursor block -->
  <rect x="11" y="26" width="4" height="2" fill="#00ff41"/>
  <!-- Stand neck -->
  <rect x="23" y="34" width="4" height="6" rx="1" fill="#0d1520" stroke="#00d4ff" stroke-width="1"/>
  <!-- Stand base -->
  <rect x="15" y="40" width="20" height="3" rx="1.5" fill="#0d1520" stroke="#00d4ff" stroke-width="1.2"/>
  <!-- Status LED -->
  <circle cx="42" cy="30" r="1.5" fill="#00ff41"/>
</svg>
