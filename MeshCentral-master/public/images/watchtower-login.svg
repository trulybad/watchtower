<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2028"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Radar background glow -->
  <circle cx="200" cy="180" r="150" fill="url(#radarGlow)"/>

  <!-- Radar circles -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="200" cy="180" r="90" fill="none" stroke="#00d4ff" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="200" cy="180" r="60" fill="none" stroke="#00d4ff" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="200" cy="180" r="30" fill="none" stroke="#00d4ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Radar cross lines -->
  <line x1="200" y1="60" x2="200" y2="300" stroke="#00d4ff" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="80" y1="180" x2="320" y2="180" stroke="#00d4ff" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="115" y1="95" x2="285" y2="265" stroke="#00d4ff" stroke-opacity="0.04" stroke-width="0.5"/>
  <line x1="285" y1="95" x2="115" y2="265" stroke="#00d4ff" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Radar sweep beam -->
  <g filter="url(#softGlow)">
    <path d="M200,180 L200,60 A120,120 0 0,1 304,120 Z" fill="url(#beamGrad)" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 200 180" to="360 200 180" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Blips on radar -->
  <circle cx="160" cy="130" r="3" fill="#00ff41" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="150" r="2.5" fill="#00ff41" opacity="0.6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="210" r="2" fill="#00ff41" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="200" r="2" fill="#ff8c00" opacity="0.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Center dot -->
  <circle cx="200" cy="180" r="4" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="8" fill="url(#centerGlow)"/>

  <!-- Tower base structure -->
  <g opacity="0.9">
    <!-- Tower body -->
    <path d="M185,300 L190,240 L210,240 L215,300 Z" fill="url(#towerGrad)" stroke="#2a3a4a" stroke-width="1"/>
    <!-- Tower top platform -->
    <rect x="178" y="235" width="44" height="8" rx="2" fill="#1a2028" stroke="#2a3a4a" stroke-width="1"/>
    <!-- Tower beacon -->
    <rect x="195" y="220" width="10" height="15" rx="1" fill="#141a22" stroke="#2a3a4a" stroke-width="0.5"/>
    <!-- Beacon light -->
    <circle cx="200" cy="218" r="5" fill="#00d4ff" opacity="0.9" filter="url(#glow)">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Light rays from beacon -->
    <line x1="190" y1="218" x2="170" y2="215" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="0.5"/>
    <line x1="210" y1="218" x2="230" y2="215" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="0.5"/>
    <!-- Tower cross struts -->
    <line x1="190" y1="260" x2="210" y2="275" stroke="#2a3a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <line x1="210" y1="260" x2="190" y2="275" stroke="#2a3a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <line x1="191" y1="275" x2="209" y2="290" stroke="#2a3a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <line x1="209" y1="275" x2="191" y2="290" stroke="#2a3a4a" stroke-width="0.5" stroke-opacity="0.5"/>
  </g>

  <!-- Ground line -->
  <line x1="140" y1="300" x2="260" y2="300" stroke="#2a3a4a" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="155" y1="303" x2="245" y2="303" stroke="#1e2a36" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Outer ring decoration -->
  <circle cx="200" cy="180" r="145" fill="none" stroke="#00d4ff" stroke-opacity="0.04" stroke-width="0.5" stroke-dasharray="4,8"/>

  <!-- Small tick marks on outer ring -->
  <g stroke="#00d4ff" stroke-opacity="0.1" stroke-width="0.5">
    <line x1="200" y1="35" x2="200" y2="42"/>
    <line x1="200" y1="318" x2="200" y2="325"/>
    <line x1="55" y1="180" x2="62" y2="180"/>
    <line x1="338" y1="180" x2="345" y2="180"/>
  </g>

  <!-- WatchTower text under tower -->
  <text x="200" y="340" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#00d4ff" opacity="0.5" letter-spacing="4">WATCHTOWER</text>
  <text x="200" y="355" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="7" font-weight="400" fill="#7a8a9a" opacity="0.4" letter-spacing="6">COMMAND &amp; CONTROL</text>
</svg>